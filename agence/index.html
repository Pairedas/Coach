<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Agence Pro — Gestion UV &amp; Espèces</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070b12">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agence Pro">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070b12;--ink2:#0d1420;--ink3:#131e2f;--ink4:#1a2942;--ink5:#22334f;
  --line:#1c2c42;--line2:#28405e;
  --green:#4ade80;--red:#ff5f5f;--amber:#ffb830;--blue:#4d9eff;--cyan:#38f0d0;
  --orange:#ff7900;
  --txt:#e2ecf7;--txt2:#8aa2bd;--txt3:#4a6284;
  --r:16px;--r2:12px;
  --sh:0 10px 34px rgba(0,0,0,.42);
  --tr:.18s cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--txt);font-family:'Outfit',sans-serif;min-height:100vh;padding-bottom:84px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 700px 480px at 92% -6%,rgba(255,121,0,.06) 0%,transparent 55%),
  radial-gradient(ellipse 620px 620px at -8% 96%,rgba(56,240,208,.045) 0%,transparent 55%)}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 32px}
.view{animation:fadeUp .28s cubic-bezier(.3,.8,.4,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── header ── */
.hdr{display:flex;align-items:center;gap:11px;padding:6px 2px 16px}
.hdr-icon{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ff7900,#ffb340);display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 4px 18px rgba(255,121,0,.35);flex-shrink:0}
.hdr h1{font-family:'Nunito',sans-serif;font-size:17.5px;font-weight:900;line-height:1.1;letter-spacing:-.2px}
.hdr h1 em{color:var(--orange);font-style:normal}
.hdr .sub{font-size:10.5px;color:var(--txt3);font-weight:500;margin-top:1px}
.hdr-right{margin-left:auto;text-align:right}
.hdr-date{font-size:11px;color:var(--txt2);font-weight:600;text-transform:capitalize}
.hdr-clock{font-family:'Fira Code',monospace;font-size:15px;font-weight:500;color:var(--txt)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-top:3px;letter-spacing:.3px}
.chip .dot{width:6px;height:6px;border-radius:50%}
.chip.open{background:rgba(74,222,128,.12);color:var(--green)}.chip.open .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.chip.closed{background:rgba(122,147,174,.12);color:var(--txt2)}.chip.closed .dot{background:var(--txt3)}
.chip.locked{background:rgba(77,158,255,.12);color:var(--blue)}.chip.locked .dot{background:var(--blue)}

/* ── cards ── */
.card{background:linear-gradient(180deg,var(--ink2),rgba(13,20,32,.85));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.22)}
.card h2{font-family:'Nunito',sans-serif;font-size:14.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.card h2 .hic{width:28px;height:28px;border-radius:8px;background:var(--ink4);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.card h2 .tag{margin-left:auto;font-size:9.5px;font-family:'Fira Code',monospace;color:var(--txt3);font-weight:400}
.hint{font-size:11.5px;color:var(--txt2);line-height:1.6;background:rgba(77,158,255,.06);border:1px solid rgba(77,158,255,.14);border-radius:10px;padding:10px 12px;margin:10px 0}
.hint.warn{background:rgba(255,184,48,.07);border-color:rgba(255,184,48,.2);color:#ffd98a}
.hint.danger{background:rgba(255,95,95,.07);border-color:rgba(255,95,95,.22);color:#ffb3b3}

/* ── KPI tiles ── */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r2);padding:13px 14px}
.kpi .kl{font-size:9px;font-family:'Fira Code',monospace;text-transform:uppercase;letter-spacing:1.2px;color:var(--txt3)}
.kpi .kv{font-family:'Nunito',sans-serif;font-size:19px;font-weight:900;margin-top:5px;line-height:1.1;letter-spacing:-.3px}
.kpi .ks{font-size:10px;color:var(--txt3);margin-top:3px}
.kpi.hero{grid-column:1/-1;text-align:center;padding:20px 16px;border-radius:var(--r)}
.kpi.hero .kv{font-size:38px}
.kpi.hero.bad{background:linear-gradient(165deg,rgba(255,95,95,.12),var(--ink2));border-color:rgba(255,95,95,.4)}
.kpi.hero.bad .kv{color:var(--red);text-shadow:0 0 30px rgba(255,95,95,.3)}
.kpi.hero.ok{background:linear-gradient(165deg,rgba(74,222,128,.1),var(--ink2));border-color:rgba(74,222,128,.35)}
.kpi.hero.ok .kv{color:var(--green)}
.kpi.hero.warn{background:linear-gradient(165deg,rgba(255,184,48,.1),var(--ink2));border-color:rgba(255,184,48,.32)}
.kpi.hero.warn .kv{color:var(--amber)}

/* ── banner ── */
.banner{display:flex;gap:11px;align-items:center;background:rgba(255,184,48,.09);border:1px solid rgba(255,184,48,.38);border-radius:13px;padding:12px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.5;color:#ffd98a}
.banner.green{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.32);color:#a8f0c4}
.banner .em{font-size:22px;flex-shrink:0}

/* ── répartition (stacked bar) ── */
.stack{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden;margin:4px 0 12px}
.stack .seg{height:100%;min-width:3px;transition:width .5s cubic-bezier(.3,.8,.3,1);cursor:pointer}
.stack .seg:first-child{border-radius:4px 0 0 4px}
.stack .seg:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:7px 14px}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt2)}
.lg .ld{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.lg b{color:var(--txt);font-family:'Nunito',sans-serif;font-weight:800}

/* ── chart ── */
.chart-wrap{position:relative}
.chart-tip{position:absolute;background:var(--ink5);border:1px solid var(--line2);border-radius:9px;padding:7px 11px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5;box-shadow:var(--sh);transform:translate(-50%,-110%)}
.chart-tip b{font-family:'Nunito',sans-serif}
.chart-tip .td{color:var(--txt3);font-size:9.5px;font-family:'Fira Code',monospace}
svg .bar{cursor:pointer}
svg text{font-family:'Fira Code',monospace}

/* ── service rows ── */
.svc-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.svc-row:last-child{border-bottom:none}
.svc-dot{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--ink3);border:1px solid var(--line)}
.svc-name{font-size:13px;font-weight:600}
.svc-val{margin-left:auto;font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.2px}
.svc-sub{font-size:10px;color:var(--txt3);font-family:'Fira Code',monospace;margin-top:1px}
.delta{font-size:10px;font-family:'Fira Code',monospace;margin-left:6px}

/* ── inputs ── */
label.fl{display:block;font-size:10px;font-family:'Fira Code',monospace;text-transform:uppercase;letter-spacing:1.2px;color:var(--txt2);margin:13px 0 6px}
input,select,textarea{width:100%;background:var(--ink3);border:1.5px solid var(--line2);border-radius:11px;color:var(--txt);font-family:'Outfit',sans-serif;font-size:15px;padding:12px 13px;outline:none;transition:border-color var(--tr),box-shadow var(--tr)}
input:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,121,0,.12)}
input.money{text-align:right;font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;letter-spacing:.3px}
.in-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.in-row .svc-dot{width:38px;height:38px}
.in-row .in-name{width:84px;font-size:12.5px;font-weight:600;flex-shrink:0;line-height:1.25}
.suffix{position:relative}
.ck{display:flex;align-items:center;gap:11px;margin-top:14px;font-size:13px;font-weight:500;cursor:pointer;line-height:1.4}
.ck input{width:21px;height:21px;flex-shrink:0;accent-color:var(--orange)}

/* ── buttons ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:13px;font-family:'Nunito',sans-serif;font-size:14.5px;font-weight:800;cursor:pointer;margin-top:12px;transition:transform .12s,box-shadow .12s,filter .12s;letter-spacing:.1px}
.btn:active{transform:scale(.97);filter:brightness(1.08)}
.btn.primary{background:linear-gradient(135deg,#ff7900,#ffa040);color:#1a0d00;box-shadow:0 6px 20px rgba(255,121,0,.28)}
.btn.green{background:linear-gradient(135deg,#22c55e,#6cebA0);color:#03140a;box-shadow:0 6px 20px rgba(74,222,128,.22)}
.btn.blue{background:linear-gradient(135deg,#3b82f6,#7db9ff);color:#041020;box-shadow:0 6px 20px rgba(77,158,255,.22)}
.btn.ghost{background:var(--ink3);color:var(--txt2);border:1px solid var(--line2)}
.btn.red{background:rgba(255,95,95,.12);color:var(--red);border:1px solid rgba(255,95,95,.38)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-sm{width:auto;padding:9px 15px;font-size:12px;margin-top:0;border-radius:10px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{margin-top:12px}

/* ── checkpoint pills ── */
.cp-strip{display:flex;gap:9px;margin-bottom:14px}
.cp-pill{flex:1;text-align:center;background:var(--ink2);border:1px solid var(--line);border-radius:13px;padding:11px 6px;transition:border-color var(--tr)}
.cp-pill .t{font-family:'Fira Code',monospace;font-size:11px;color:var(--txt2)}
.cp-pill .s{font-size:18px;margin:4px 0 2px}
.cp-pill .v{font-size:9.5px;font-family:'Fira Code',monospace;color:var(--txt3)}
.cp-pill.done{border-color:rgba(74,222,128,.42);background:linear-gradient(180deg,rgba(74,222,128,.07),var(--ink2))}
.cp-pill.done .v{color:var(--green)}
.cp-pill.due{border-color:rgba(255,184,48,.55);background:linear-gradient(180deg,rgba(255,184,48,.08),var(--ink2));animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}

/* ── calc ── */
.calc{font-size:13px}
.calc .cr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.calc .cr:last-child{border-bottom:none}
.calc .cr b{font-family:'Nunito',sans-serif;font-weight:800}
.calc .cr.total{font-size:14.5px;padding-top:10px}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--txt2)}

/* ── movements ── */
.mv{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.mv:last-child{border-bottom:none}
.mv .ic{width:32px;height:32px;border-radius:9px;background:var(--ink3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.mv .tt{font-weight:600;line-height:1.3}
.mv .ts{font-size:10px;color:var(--txt3);font-family:'Fira Code',monospace;margin-top:1px}
.mv .amt{margin-left:auto;font-family:'Nunito',sans-serif;font-weight:800;white-space:nowrap;font-size:13.5px}
.mv .del{background:var(--ink3);border:1px solid var(--line);border-radius:8px;color:var(--txt3);font-size:13px;cursor:pointer;padding:6px 9px;margin-left:4px;transition:color var(--tr)}
.mv .del:active{color:var(--red)}

/* ── segmented ── */
.seg{display:flex;background:var(--ink3);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px;border:1px solid var(--line)}
.seg button{flex:1;padding:10px 4px;border:none;background:none;color:var(--txt2);font-family:'Nunito',sans-serif;font-weight:800;font-size:12.5px;border-radius:9px;cursor:pointer;transition:background var(--tr),color var(--tr)}
.seg button.on{background:var(--ink5);color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* ── history ── */
.hday{background:var(--ink2);border:1px solid var(--line);border-radius:14px;margin-bottom:11px;overflow:hidden}
.hday-head{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer}
.hday-head .hcal{width:40px;height:40px;border-radius:11px;background:var(--ink3);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.hday-head .hcal .hd1{font-family:'Nunito',sans-serif;font-size:15px;font-weight:900;line-height:1}
.hday-head .hcal .hd2{font-size:8px;text-transform:uppercase;color:var(--txt3);letter-spacing:.5px}
.hday-head .d{font-weight:700;font-size:13px;text-transform:capitalize}
.hday-head .s{font-size:10px;color:var(--txt3);font-family:'Fira Code',monospace;margin-top:2px}
.hday-head .m{margin-left:auto;font-family:'Nunito',sans-serif;font-weight:900;font-size:14.5px;text-align:right}
.hday-head .chev{color:var(--txt3);font-size:11px;margin-left:6px;transition:transform var(--tr)}
.hday.open .chev{transform:rotate(90deg)}
.hday-body{padding:2px 15px 14px;border-top:1px solid var(--line);font-size:12.5px}

/* ── nav ── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(9,13,21,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{position:relative;background:none;border:none;color:var(--txt3);font-family:'Outfit',sans-serif;font-size:9.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:5px 10px;border-radius:11px;min-width:56px;transition:color var(--tr)}
.nav button .i{font-size:20px;transition:transform .15s}
.nav button.on{color:var(--orange)}
.nav button.on .i{transform:translateY(-1px)}
.nav button.on::after{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--orange);box-shadow:0 2px 8px rgba(255,121,0,.5)}
.nav button .bdg{position:absolute;top:2px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}

/* ── modal ── */
.modal{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.on{opacity:1;pointer-events:auto}
.modal .veil{position:absolute;inset:0;background:rgba(3,5,9,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal .sheet{position:relative;width:100%;max-width:640px;background:var(--ink2);border:1px solid var(--line2);border-bottom:none;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .22s cubic-bezier(.3,.8,.4,1);box-shadow:0 -12px 50px rgba(0,0,0,.55)}
.modal.on .sheet{transform:none}
.modal .grip{width:38px;height:4px;border-radius:3px;background:var(--line2);margin:0 auto 16px}
.md-ic{width:52px;height:52px;border-radius:15px;background:var(--ink4);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:25px;margin:0 auto 12px}
.modal h3{font-family:'Nunito',sans-serif;font-size:17px;font-weight:900;text-align:center}
.modal .md-sub{font-size:12.5px;color:var(--txt2);text-align:center;margin-top:6px;line-height:1.55}
.md-btns{display:flex;gap:10px;margin-top:18px}
.md-btns .btn{margin-top:0}
/* PIN pad */
.pin-dots{display:flex;gap:12px;justify-content:center;margin:18px 0 6px;min-height:14px}
.pin-dots .pd{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line2);transition:background var(--tr),border-color var(--tr)}
.pin-dots .pd.f{background:var(--orange);border-color:var(--orange);box-shadow:0 0 8px rgba(255,121,0,.5)}
.pin-dots.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:270px;margin:14px auto 0}
.pin-pad button{padding:15px;border-radius:13px;background:var(--ink3);border:1px solid var(--line);color:var(--txt);font-family:'Nunito',sans-serif;font-size:19px;font-weight:800;cursor:pointer;transition:background .1s,transform .1s}
.pin-pad button:active{background:var(--ink5);transform:scale(.94)}
.pin-pad button.soft{color:var(--txt3);font-size:15px}

/* ── toast ── */
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink5);border:1px solid var(--line2);color:var(--txt);padding:12px 18px;border-radius:13px;font-size:13px;font-weight:600;z-index:400;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;max-width:88vw;text-align:center;box-shadow:var(--sh);line-height:1.45}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── wizard ── */
.wiz-dots{display:flex;gap:7px;justify-content:center;margin:4px 0 18px}
.wiz-dots .wd{width:7px;height:7px;border-radius:4px;background:var(--line2);transition:all var(--tr)}
.wiz-dots .wd.on{width:22px;background:var(--orange)}
.wiz-hero{text-align:center;padding:26px 0 8px}
.wiz-hero .wic{font-size:56px;margin-bottom:12px;display:block}
.wiz-hero h2{font-family:'Nunito',sans-serif;font-size:22px;font-weight:900;line-height:1.25}
.wiz-hero p{font-size:13px;color:var(--txt2);margin-top:9px;line-height:1.65}
.feat{display:flex;gap:13px;align-items:flex-start;padding:11px 0}
.feat .fi{width:38px;height:38px;border-radius:11px;background:var(--ink3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.feat .ft{font-size:13px;font-weight:700}
.feat .fs{font-size:11.5px;color:var(--txt2);margin-top:2px;line-height:1.5}

.empty{text-align:center;color:var(--txt3);font-size:12.5px;padding:22px 0;line-height:1.6}
.empty .ei{font-size:30px;display:block;margin-bottom:8px;opacity:.6}
.small{font-size:11px;color:var(--txt3);line-height:1.55;margin-top:8px}
h3.sec{font-family:'Nunito',sans-serif;font-size:11.5px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:1.2px;margin:16px 0 8px}
.foot{text-align:center;font-size:10px;color:var(--txt3);font-family:'Fira Code',monospace;padding:18px 0 4px}
</style>
</head>
<body>
<div id="app"></div>

<nav class="nav" id="nav" style="display:none">
  <button id="nav-jour" onclick="go('jour')"><span class="i">📊</span>Jour</button>
  <button id="nav-pointage" onclick="go('pointage')"><span class="i">✅</span>Pointage<span class="bdg" id="bdg-cp" style="display:none"></span></button>
  <button id="nav-mouvements" onclick="go('mouvements')"><span class="i">💸</span>Mouvements</button>
  <button id="nav-historique" onclick="go('historique')"><span class="i">📅</span>Historique</button>
  <button id="nav-reglages" onclick="go('reglages')"><span class="i">⚙️</span>Réglages</button>
</nav>

<div class="modal" id="modal">
  <div class="veil" onclick="resolveModal(null)"></div>
  <div class="sheet"><div class="grip"></div><div id="modal-body"></div></div>
</div>
<div id="toast"></div>

function fmtK(n){

/* champs montant : saisie libre, affichage groupé par milliers */
function fmtIn(el){

  el.value = d ? (neg?'-':'') + (+d).toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g,' ') : (neg?'-':'');

function num(v){

  const neg = s.trim().startsWith('-');

function moneyVal(n){ return n ? (+n).toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g,' ') : ''; }
function todayKey(d){

function frDate(key){
  const [y,m,d] = key.split('-');
  return new Date(+y, m-1, +d).toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'});

function nowHM(){

function getDay(){ return S.days[todayKey()] || null; }

function totalOf(soldes){ return SERVICES.reduce((a,s)=> a + (+soldes[s.k]||0), 0); }
function sumMv(day, type){ return (day[type]||[]).reduce((a,m)=> a + (+m.montant||0), 0); }
function theorique(day){ return totalOf(day.ouverture.soldes) + sumMv(day,'entrees') - sumMv(day,'sorties'); }
function lastCp(day){

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function vibrate(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

function pinKey(k){

/* ══════════ SYNCHRONISATION PAGE ADMIN (Google Sheets) ══════════ */
function syncOn(){ return !!(S.config.syncUrl && S.config.syncSecret); }
/* JSONP : contourne les blocages CORS de Safari/iPhone (« Load failed ») */
function jsonpGet(url, params, timeoutMs){
  return new Promise((resolve, reject)=>{
    const cb = '__agcb' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const qs = Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
    let done = false;
    const to = setTimeout(()=>{ finish(null, new Error('délai dépassé')); }, timeoutMs||20000);
    function finish(val, err){
      if(done) return; done = true;
      clearTimeout(to); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } s.remove();
      err ? reject(err) : resolve(val);
    }
    window[cb] = j => finish(j);
    s.onerror = () => finish(null, new Error('script injoignable'));
    s.src = url + (url.includes('?')?'&':'?') + qs + '&callback=' + cb;
    document.body.appendChild(s);
  });
}
async function apiGet(url, params){
  try{
    const qs = Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
    const r = await fetch(url + (url.includes('?')?'&':'?') + qs);
    return await r.json();
  }catch(e){
    return await jsonpGet(url, params);
  }
}
/* Envoi, 3 niveaux : 1) POST text/plain (pas de préflight) ;
   2) GET+JSONP (action=push) si le navigateur bloque le fetch ;
   3) formulaire caché — une soumission de formulaire n'est jamais
   bloquée (réponse illisible : on considère l'envoi fait). */
function formPost(body){
  try{
    /* une iframe dédiée par envoi : deux soumissions vers la même cible
       s'annuleraient mutuellement */
    const id = 'ag-sink-' + Math.random().toString(36).slice(2);
    const fr = document.createElement('iframe');
    fr.name = id; fr.style.display = 'none';
    document.body.appendChild(fr);
    const f = document.createElement('form');
    f.method = 'POST'; f.action = S.config.syncUrl; f.target = id; f.style.display = 'none';
    const i = document.createElement('input');
    i.type = 'hidden'; i.name = 'data';
    i.value = JSON.stringify(Object.assign({secret:S.config.syncSecret}, body));
    f.appendChild(i);
    document.body.appendChild(f);
    f.submit();
    setTimeout(()=>{ f.remove(); fr.remove(); }, 15000);
    return true;
  }catch(e){ return false; }
}
async function cloudPost(body){
  if(!syncOn()) return false;
  try{
    const r = await fetch(S.config.syncUrl, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({secret:S.config.syncSecret}, body))
    });
    const j = await r.json();
    return !!j.ok;
  }catch(e){
    try{
      const j = await jsonpGet(S.config.syncUrl, {
        action:'push', secret:S.config.syncSecret, data: JSON.stringify(body)
      });
      return !!(j && j.ok);
    }catch(e2){
      return formPost(body);
    }
  }
}
function daySnapshot(){
  const day = getDay(); if(!day) return null;
  const cp = lastCp(day);
  const mj = cp ? cp.theorique - cp.reelTotal : null;
  const ancien = +day.ouverture.manquantInitial||0;
  return {
    date: todayKey(), maj: nowHM(), agence: S.config.agence, agent: S.config.agent,
    ouverture: totalOf(day.ouverture.soldes),
    entrees: sumMv(day,'entrees'), sorties: sumMv(day,'sorties'),
    theorique: theorique(day),
    reel: cp ? cp.reelTotal : '', manquantJour: cp ? mj : '',
    ancien, manquantTotal: cp ? mj + ancien : '',
    nbPointages: (day.checkpoints||[]).filter(c=>c).length,
    cloturee: !!day.cloture,
    detail: {
      ouverture: day.ouverture,
      checkpoints: (day.checkpoints||[]).filter(c=>c),
      sorties: day.sorties, entrees: day.entrees
    }
  };
}
/* dernier état gagne : si l'envoi échoue (hors-ligne), on marque « à renvoyer » */
function syncDay(){
  if(!syncOn()) return;
  const snap = daySnapshot(); if(!snap) return;
  S.dayDirty = true; save();
  cloudPost({action:'day', day:snap}).then(ok=>{ if(ok){ S.dayDirty = false; save(); } });
}
function syncEvent(type, texte){
  if(!syncOn()) return;
  const ev = {ts: nowHM(), date: todayKey(), type, texte: String(texte).replace(/<[^>]+>/g,'')};
  cloudPost({action:'event', event:ev}).then(ok=>{
    if(!ok){ S.evQueue.push(ev); if(S.evQueue.length>100) S.evQueue = S.evQueue.slice(-100); save(); }
  });
}
/* file d'attente hors-ligne, vidée à chaque tick des rappels */
async function flushSync(){
  if(!syncOn()) return;
  if(S.dayDirty && getDay()){
    const ok = await cloudPost({action:'day', day:daySnapshot()});
    if(ok){ S.dayDirty = false; save(); }
  }
  while(S.evQueue.length){
    const ok = await cloudPost({action:'event', event:S.evQueue[0]});
    if(!ok) break;
    S.evQueue.shift(); save();
  }
}
async function testSync(){
  if(!await saveCfg()) return;
  if(!syncOn()){ toast('⚠️ Renseigne l\'URL du script et le code secret'); return; }
  toast('⏳ Test de connexion…');
  try{
    const j = await apiGet(S.config.syncUrl, {action:'ping', secret:S.config.syncSecret});
    if(!j.ok) throw new Error(j.error||'réponse invalide');
    toast('✅ Synchronisation connectée !');
    syncDay();
  }catch(e){
    toast('❌ Connexion impossible : '+e.message);
  }
}

function vWizard(){
  const c = S.config;
  const dots = `<div class="wiz-dots">${[0,1,2,3,4].map(i=>`<span class="wd ${i===wizStep?'on':''}"></span>`).join('')}</div>`;
  if(wizStep===0) return `
    <div class="wiz-hero">

      <div class="feat"><div class="fi">✅</div><div><div class="ft">3 pointages par jour</div><div class="fs">L'app compare le réel au théorique et localise le manquant dans la journée.</div></div></div>
      <div class="feat"><div class="fi">📨</div><div><div class="ft">Rapports Telegram automatiques</div><div class="fs">Chaque pointage part chez l'admin, impossible de l'oublier.</div></div></div>
      <div class="feat"><div class="fi">🛡️</div><div><div class="ft">Anti-triche intégré</div><div class="fs">Code admin, alertes en cas de correction ou suppression, journal complet.</div></div></div>
    </div>
    <button class="btn primary" onclick="wizStep=1;render()">Commencer →</button>`;

  if(wizStep===1) return dots+`

  if(wizStep===3) return dots+`

      <button class="btn primary" onclick="wizSave(3)">Continuer →</button>
    </div>`;

  return dots+`
    <div class="card"><h2><span class="hic">📨</span>Telegram (admin)</h2>

}
function wizSave(step){
  const c = S.config;

    c.dimancheOff = $('wz-dimanche').checked;

    wizStep = 3;

    const p = $('wz-pin').value.trim();
    if(p && !/^\d{4,6}$/.test(p)){ toast('⚠️ Le code doit faire 4 à 6 chiffres'); return; }
    c.adminPin = p;
    wizStep = 4;
  }
  save(); render();
}
function wizFinish(withTg){

  if(withTg){
    c.tgToken = $('wz-tgtoken').value.trim();
    c.tgChat = $('wz-tgchat').value.trim();

  audit('🚀 Configuration initiale terminée');
  save();
  toast('🎉 Configuration terminée — bienvenue !');
  go('jour');
}
function relabelCps(){

  c.checkpoints[1].label = 'Après-midi '+c.checkpoints[1].t.slice(0,2)+'H';
  c.checkpoints[2].label = 'Fermeture '+c.checkpoints[2].t.slice(0,2)+'H';
}

/* ══════════ GRAPHIQUES ══════════ */
function stackBar(soldes){
  const total = totalOf(soldes);
  if(total <= 0) return '';
  const segs = STACK_ORDER.map(k=>{
    const s = SERVICES.find(x=>x.k===k);
    const v = +soldes[k]||0;
    return {s, v, w: v/total*100};
  }).filter(x=>x.v>0);
  return `<div class="stack">${segs.map(x=>
    `<div class="seg" style="width:${x.w}%;background:${x.s.cc}" onclick="toast('${x.s.e} ${x.s.n} : ${fmt(x.v)} (${Math.round(x.w)}%)')"></div>`
  ).join('')}</div>
  <div class="legend">${SERVICES.filter(s=>(+soldes[s.k]||0)>0).map(s=>
    `<span class="lg"><span class="ld" style="background:${s.cc}"></span>${s.n.replace('UV ','')} <b>${fmtK(+soldes[s.k]||0)}</b></span>`
  ).join('')}</div>`;
}

function chartManquant(){
  const keys = Object.keys(S.days).sort().slice(-14);
  const data = keys.map(k=>{
    const d = S.days[k];
    const cp = lastCp(d);
    if(!cp) return null;
    return {k, v: (cp.theorique - cp.reelTotal) + 0};
  }).filter(Boolean);
  if(data.length < 2) return '';
  const W = 320, H = 130, padT = 18, padB = 18, padL = 4, padR = 4;
  const maxAbs = Math.max(...data.map(d=>Math.abs(d.v)), 1);
  const zero = padT + (H-padT-padB) * (maxAbs / (maxAbs*2));
  const bw = Math.min(22, (W-padL-padR) / data.length - 4);
  const iMax = data.reduce((mi,d,i)=> Math.abs(d.v) > Math.abs(data[mi].v) ? i : mi, 0);
  let bars = '', labels = '';
  data.forEach((d,i)=>{
    const cx = padL + (W-padL-padR) * (i+.5)/data.length;
    const hpx = Math.max(3, Math.abs(d.v)/maxAbs * (H-padT-padB)/2);
    const y = d.v >= 0 ? zero - hpx : zero;
    const col = d.v > 0 ? 'var(--red)' : 'var(--green)';
    const dd = d.k.slice(8);
    bars += `<rect class="bar" x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hpx.toFixed(1)}" rx="3" fill="${col}" fill-opacity="${d.v>0?'.92':'.85'}" onclick="chartTip(event,'${d.k}',${d.v})"><title>${frDate(d.k)} : ${d.v>0?'manquant ':''}${fmt(Math.abs(d.v))}${d.v<0?' de surplus':''}</title></rect>`;
    if(i===iMax && d.v!==0) labels += `<text x="${cx.toFixed(1)}" y="${(d.v>=0? y-5 : y+hpx+11).toFixed(1)}" font-size="9" fill="${d.v>0?'var(--red)':'var(--green)'}" text-anchor="middle" font-weight="600">${d.v>0?'−':'+'}${fmtK(Math.abs(d.v))}</text>`;
    labels += `<text x="${cx.toFixed(1)}" y="${H-4}" font-size="8" fill="var(--txt3)" text-anchor="middle">${dd}</text>`;
  });
  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
      <line x1="${padL}" y1="${zero.toFixed(1)}" x2="${W-padR}" y2="${zero.toFixed(1)}" stroke="var(--line2)" stroke-width="1"/>
      ${bars}${labels}
    </svg>
    <div class="chart-tip" id="chart-tip"></div>
  </div>
  <div class="legend" style="margin-top:8px">
    <span class="lg"><span class="ld" style="background:var(--red)"></span>Manquant du jour</span>
    <span class="lg"><span class="ld" style="background:var(--green)"></span>Surplus</span>
  </div>`;
}
function chartTip(ev, k, v){
  const tip = $('chart-tip'); if(!tip) return;
  const wrap = tip.parentElement.getBoundingClientRect();
  tip.innerHTML = `<div class="td">${frDate(k)}</div><b class="${v>0?'neg':'pos'}">${v>0?'−':'+'}${fmt(Math.abs(v))}</b>`;
  tip.style.left = Math.min(Math.max(ev.clientX - wrap.left, 60), wrap.width-60)+'px';
  tip.style.top = (ev.clientY - wrap.top)+'px';
  tip.style.opacity = 1;
  clearTimeout(tip._h); tip._h = setTimeout(()=> tip.style.opacity = 0, 2200);
}

/* ══════════ VUE : JOUR ══════════ */
function vJour(){
  const day = getDay();
  let h = header();

  if(!day && isOffDay() && !forceOpen){

      <div class="kl">Dimanche</div>

        const pre = prev && prev.reel && prev.reel[s.k]!=null ? moneyVal(prev.reel[s.k]) : '';

          <div class="svc-dot">${s.e}</div><div class="in-name">${s.n}</div>
          <input type="text" inputmode="numeric" class="money" id="ouv-${s.k}" placeholder="0" value="${pre}" oninput="fmtIn(this)">
        </div>`;
      }).join('')}
      <label class="fl">📉 Ancien manquant (total existant)</label>
      <input type="text" inputmode="numeric" class="money" id="ouv-manquant" placeholder="0" value="${prev && prev.manquantTotal ? moneyVal(prev.manquantTotal) : ''}" oninput="fmtIn(this)">
      ${prev ? `<div class="small">↳ Pré-rempli avec la fermeture du ${frDate(prev.key)}. Modifie si besoin.</div>` : ''}

  }

  const cp = lastCp(day);
  const dueIdx = checkpointDue(day);

  if(dueIdx !== null){
    h += `<div class="banner"><span class="em">⏰</span><div><b>Pointage « ${esc(S.config.checkpoints[dueIdx].label)} » à faire !</b><br>Compte tes caisses et saisis les soldes réels.</div></div>`;
  }
  if(day.cloture){
    h += `<div class="banner green"><span class="em">🔒</span><div><b>Journée clôturée.</b> Demain, l'ouverture sera pré-remplie avec tes soldes de fermeture.</div></div>`;
  }

  const ancien = +day.ouverture.manquantInitial||0;
  if(cp){
    const manqJour = cp.theorique - cp.reelTotal;
    const manqTotal = manqJour + ancien;
    h += `<div class="kpis">
      <div class="kpi hero ${manqTotal>0?'bad':'ok'}">
        <div class="kl">Manquant total${manqTotal<0?' (surplus)':''}</div>
        <div class="kv">${fmt(Math.abs(manqTotal))}</div>
        <div class="ks">au pointage ${esc(cp.label)} · ${cp.time}</div>
      </div>
      <div class="kpi"><div class="kl">Écart du jour</div><div class="kv ${manqJour>0?'neg':'pos'}">${manqJour>0?'−':'+'}${fmt(Math.abs(manqJour))}</div><div class="ks">théorique − réel</div></div>
      <div class="kpi"><div class="kl">Ancien manquant</div><div class="kv">${fmt(ancien)}</div><div class="ks">reporté à l'ouverture</div></div>
    </div>`;
  }else{
    h += `<div class="kpis">
      <div class="kpi hero warn">
        <div class="kl">Ancien manquant reporté</div>
        <div class="kv">${fmt(ancien)}</div>
        <div class="ks">aucun pointage encore aujourd'hui</div>
      </div>
    </div>`;
  }

  h += `<div class="cp-strip">` + S.config.checkpoints.map((c,i)=>{
    const done = day.checkpoints && day.checkpoints[i];
    const due = dueIdx === i;
    return `<div class="cp-pill ${done?'done':''} ${due?'due':''}" onclick="cpSel=${i};go('pointage')">
      <div class="t">${c.t}</div>
      <div class="s">${done?'✅':(due?'⏰':'▫️')}</div>
      <div class="v">${done? (done.theorique-done.reelTotal>0 ? '−'+fmtK(done.theorique-done.reelTotal) : 'OK') : (due?'À faire':'—')}</div>
    </div>`;
  }).join('') + `</div>`;

  const ref = cp ? cp.soldes : day.ouverture.soldes;
  h += `<div class="card"><h2><span class="hic">💼</span>Répartition des caisses <span class="tag">${cp? esc(cp.label) : 'ouverture'}</span></h2>
    ${stackBar(ref)}
  </div>`;

  h += `<div class="card"><h2><span class="hic">🧮</span>Situation <span class="tag">temps réel</span></h2>
    <div class="calc">
      <div class="cr"><span class="mut">Total ouverture (${day.ouverture.time})</span><b>${fmt(totalOf(day.ouverture.soldes))}</b></div>

      <div class="cr"><span class="mut">− Sorties</span><b class="neg">−${fmt(sumMv(day,'sorties'))}</b></div>
      <div class="cr total"><span>= Total théorique</span><b style="color:var(--cyan)">${fmt(th)}</b></div>
      ${cp? `<div class="cr"><span class="mut">Dernier réel (${esc(cp.label)})</span><b>${fmt(cp.reelTotal)}</b></div>`:''}
    </div>
    <div class="hint">💡 Les dépôts/retraits clients ne changent pas le total (UV ↔ espèces). Tu ne saisis que les <b>sorties</b> et les <b>entrées</b>.</div>
  </div>`;

  h += `<div class="card"><h2><span class="hic">💰</span>Soldes ${cp? 'réels — '+esc(cp.label) : "d'ouverture"}</h2>`+
    SERVICES.map(s=>{
      const cur = +ref[s.k]||0, ouv = +day.ouverture.soldes[s.k]||0, d = cur - ouv;
      return `<div class="svc-row">
        <div class="svc-dot">${s.e}</div>
        <div><div class="svc-name">${s.n}</div><div class="svc-sub">ouverture ${fmt(ouv)}${cp&&d!==0?`<span class="delta ${d>0?'pos':'neg'}">${d>0?'▲':'▼'}${fmtK(Math.abs(d))}</span>`:''}</div></div>
        <div class="svc-val" style="color:${s.c}">${fmt(cur)}</div>
      </div>`;
    }).join('') +
    `<div class="svc-row"><div class="svc-dot">Σ</div><div class="svc-name">TOTAL</div><div class="svc-val">${fmt(totalOf(ref))}</div></div>
  </div>`;

  const evo = chartManquant();
  if(evo) h += `<div class="card"><h2><span class="hic">📈</span>Manquant — 14 derniers jours</h2>${evo}</div>`;

  h += `<button class="btn blue" onclick="go('pointage')">✅ Faire un pointage</button>`;
  if(cp && !day.cloture && day.checkpoints && day.checkpoints[S.config.checkpoints.length-1]){
    h += `<button class="btn green" onclick="cloturer()">🔒 Clôturer la journée + rapport Telegram</button>`;
  }
  h += `<button class="btn ghost" onclick="resetJour()">♻️ Réinitialiser la journée</button>`;
  h += `<div class="foot">Agence Pro v${VERSION}</div>`;
  return h;
}

function lastClosedDay(){
  const keys = Object.keys(S.days).sort();
  for(let i=keys.length-1;i>=0;i--){
    const k = keys[i];
    if(k === todayKey()) continue;
    const d = S.days[k];
    const cp = lastCp(d);
    if(cp){
      const manqJour = cp.theorique - cp.reelTotal;
      return {key:k, reel:cp.soldes, manquantTotal: manqJour + (+d.ouverture.manquantInitial||0)};
    }
  }
  return null;
}

function ouvrirJour(){
  const soldes = {};
  SERVICES.forEach(s=> soldes[s.k] = num($('ouv-'+s.k).value));
  const manquantInitial = num($('ouv-manquant').value);
  if(totalOf(soldes) <= 0){ toast('⚠️ Saisis au moins un solde de départ'); return; }
  S.days[todayKey()] = {
    ouverture:{ time: nowHM(), soldes, manquantInitial },
    entrees:[], sorties:[], checkpoints:[], cloture:false
  };
  audit('🌅 Ouverture — total '+fmt(totalOf(soldes))+', ancien manquant '+fmt(manquantInitial));
  let t = '🌅 <b>OUVERTURE</b> — '+esc(S.config.agence).toUpperCase()+'\n📅 '+frDate(todayKey())+' à '+nowHM()+(S.config.agent?'\n👤 '+esc(S.config.agent):'')+'\n\n';
  SERVICES.forEach(s=>{ t += s.e+' '+s.n+' : <b>'+fmt(soldes[s.k])+'</b>\n'; });
  t += 'Σ Total départ : <b>'+fmt(totalOf(soldes))+'</b>\n📉 Ancien manquant déclaré : <b>'+fmt(manquantInitial)+'</b>';
  const prev = lastClosedDay();
  if(prev && Math.round(prev.manquantTotal) !== Math.round(manquantInitial)){
    t += '\n\n⚠️ <b>ATTENTION</b> : le manquant reporté ('+fmt(manquantInitial)+') est différent de celui de la dernière fermeture ('+fmt(prev.manquantTotal)+') !';
  }
  tgSend(t, true);
  save();
  syncDay();
  syncEvent('ouverture', 'Ouverture — total '+fmt(totalOf(soldes))+', ancien manquant '+fmt(manquantInitial));
  vibrate(40); toast('✅ Journée ouverte — bon travail !'); go('jour');
}

async function resetJour(){
  if(!await pinOk('réinitialiser la journée')) return;
  if(!await askConfirm('Réinitialiser la journée ?','Ouverture, pointages et mouvements d\'aujourd\'hui seront <b>définitivement effacés</b>.',{icon:'♻️',danger:true,ok:'Tout effacer'})) return;
  audit('♻️ Journée réinitialisée');
  alertTg('♻️ La journée du '+frDate(todayKey())+' a été <b>réinitialisée</b> (ouverture, pointages et mouvements effacés).');
  delete S.days[todayKey()]; save(); go('jour');
}

function checkpointDue(day){
  const now = nowHM();
  for(let i=0;i<S.config.checkpoints.length;i++){
    if(day.checkpoints && day.checkpoints[i]) continue;
    if(now >= S.config.checkpoints[i].t) return i;
  }
  return null;
}

/* ══════════ VUE : POINTAGE ══════════ */
function vPointage(){
  const day = getDay();
  let h = header();
  if(!day) return h + `<div class="card"><h2><span class="hic">✅</span>Pointage</h2><div class="empty"><span class="ei">🌅</span>Ouvre d'abord la journée<br>dans l'onglet 📊 Jour.</div></div>`;

  const due = checkpointDue(day);
  if(cpSel === null) cpSel = (due !== null) ? due : firstUndone(day);

  h += `<div class="card"><h2><span class="hic">✅</span>Pointage des soldes réels</h2>
    <div class="seg">` + S.config.checkpoints.map((c,i)=>{
      const done = day.checkpoints && day.checkpoints[i];
      return `<button class="${cpSel===i?'on':''}" onclick="cpSel=${i};render()">${done?'✅ ':''}${c.t}</button>`;
    }).join('') + `</div>`;

  const c = S.config.checkpoints[cpSel];
  const done = day.checkpoints && day.checkpoints[cpSel];
  const pre = done ? done.soldes : (lastCp(day) ? lastCp(day).soldes : day.ouverture.soldes);

  h += `<div class="hint">Compte <b>réellement</b> chaque caisse (${esc(c.label)}) et saisis ce que tu as devant toi — pas ce que tu « devrais » avoir.</div>`;
  h += SERVICES.map(s=>`<div class="in-row">
      <div class="svc-dot">${s.e}</div><div class="in-name">${s.n}</div>
      <input type="text" inputmode="numeric" class="money" id="cp-${s.k}" placeholder="0" value="${moneyVal(done? (+done.soldes[s.k]||0) : (+pre[s.k]||0))}" oninput="fmtIn(this)">
    </div>`).join('');

  h += `<button class="btn primary" id="btn-savecp" onclick="savePointage()">${done?'✏️ Corriger ce pointage':'💾 Valider le pointage '+c.t}</button>`;
  h += `</div>`;
  if(done){
    const manqJour = done.theorique - done.reelTotal;
    const manqTotal = manqJour + (+day.ouverture.manquantInitial||0);
    h += resultCard(day, done, manqJour, manqTotal);
    h += `<button class="btn blue" onclick="sendCp(${cpSel})">📨 Envoyer ce pointage à l'admin</button>`;
    if(done.sent) h += `<div class="small" style="text-align:center">✅ Déjà envoyé à ${done.sent}</div>`;
  }
  return h;
}

function firstUndone(day){
  for(let i=0;i<S.config.checkpoints.length;i++)
    if(!(day.checkpoints && day.checkpoints[i])) return i;
  return S.config.checkpoints.length-1;
}

function resultCard(day, cp, manqJour, manqTotal){
  const prevManq = prevManquant(day, cp.idx);
  const delta = manqJour - prevManq;
  return `<div class="card"><h2><span class="hic">🧾</span>Résultat — ${esc(cp.label)}${cp.corrections?` <span class="tag">✏️ corrigé ${cp.corrections}×</span>`:''}</h2>
    <div class="calc">
      <div class="cr"><span class="mut">Théorique (ouverture + entrées − sorties)</span><b>${fmt(cp.theorique)}</b></div>
      <div class="cr"><span class="mut">Réel compté</span><b>${fmt(cp.reelTotal)}</b></div>
      <div class="cr total"><span>Écart du jour</span><b class="${manqJour>0?'neg':'pos'}">${manqJour>0?'−':'+'}${fmt(Math.abs(manqJour))}</b></div>
      <div class="cr"><span class="mut">Depuis le pointage précédent</span><b class="${delta>0?'neg':'pos'}">${delta>0?'−':'+'}${fmt(Math.abs(delta))}</b></div>
      <div class="cr"><span class="mut">Ancien manquant</span><b>${fmt(+day.ouverture.manquantInitial||0)}</b></div>
      <div class="cr total"><span>MANQUANT TOTAL</span><b class="${manqTotal>0?'neg':'pos'}">${fmt(Math.abs(manqTotal))}${manqTotal<0?' (surplus)':''}</b></div>
    </div>
    ${delta>0? `<div class="hint danger">🔎 <b>${fmt(delta)}</b> de manquant sont apparus <b>entre le pointage précédent et ${esc(cp.label)}</b>. C'est dans cette tranche qu'il faut chercher.</div>`:''}
  </div>`;
}

function prevManquant(day, idx){
  for(let i=idx-1;i>=0;i--){
    const c = day.checkpoints && day.checkpoints[i];
    if(c) return c.theorique - c.reelTotal;
  }
  return 0;
}

async function savePointage(){
  const day = getDay(); if(!day) return;
  const soldes = {};
  SERVICES.forEach(s=> soldes[s.k] = num($('cp-'+s.k).value));
  const c = S.config.checkpoints[cpSel];
  if(!day.checkpoints) day.checkpoints = [];
  const existing = day.checkpoints[cpSel];
  if(existing){
    if(!await pinOk('corriger le pointage '+c.t)) return;
    if(!await askConfirm('Corriger le pointage '+c.t+' ?','L\'ancien pointage sera remplacé et <b>l\'admin sera notifié</b> de la correction.',{icon:'✏️',ok:'Corriger'})) return;
  }
  day.checkpoints[cpSel] = {
    idx: cpSel, label: c.label, time: nowHM(),
    soldes, reelTotal: totalOf(soldes), theorique: theorique(day),
    sent: existing ? existing.sent : null,
    corrections: existing ? (existing.corrections||0)+1 : 0
  };
  save();
  const cp = day.checkpoints[cpSel];
  const manq = cp.theorique - cp.reelTotal;
  audit('✅ Pointage '+c.t+(existing?' CORRIGÉ':'')+' — réel '+fmt(cp.reelTotal)+', écart '+fmt(manq));
  if(existing){
    const oldManq = existing.theorique - existing.reelTotal;
    alertTg('✏️ <b>Pointage '+esc(c.label)+' CORRIGÉ</b> ('+cp.corrections+'× au total)\n'
      +'Ancien réel : '+fmt(existing.reelTotal)+' (écart '+fmt(oldManq)+')\n'
      +'Nouveau réel : <b>'+fmt(cp.reelTotal)+'</b> (écart <b>'+fmt(manq)+'</b>)'
      +(S.config.agent?'\n👤 '+esc(S.config.agent):''));
  }
  vibrate(manq>0? [60,40,60] : 40);
  toast(manq>0 ? '⚠️ Manquant du jour : '+fmt(manq) : '✅ Pointage OK — rien ne manque !');
  if(S.config.autoSend) sendCp(cpSel, true);
  syncDay();
  syncEvent('pointage', 'Pointage '+c.label+(existing?' (corrigé)':'')+' — réel '+fmt(cp.reelTotal)+', écart du jour '+fmt(manq));
  render();
}

/* ══════════ VUE : MOUVEMENTS ══════════ */
function vMouvements(){
  const day = getDay();
  let h = header();
  if(!day) return h + `<div class="card"><h2><span class="hic">💸</span>Mouvements</h2><div class="empty"><span class="ei">🌅</span>Ouvre d'abord la journée<br>dans l'onglet 📊 Jour.</div></div>`;

  h += `<div class="card"><h2><span class="hic">💸</span>Nouveau mouvement</h2>
    <div class="seg">
      <button class="${mvType==='sortie'?'on':''}" onclick="mvType='sortie';render()">📤 Sortie</button>
      <button class="${mvType==='entree'?'on':''}" onclick="mvType='entree';render()">📥 Entrée / Appro</button>
    </div>
    <div class="hint">${mvType==='sortie'
      ? '<b>Sortie</b> = argent qui quitte l\'agence : dépense, versement à l\'admin, transport, crédit pris…'
      : '<b>Entrée</b> = argent injecté dans l\'agence : appro UV offert par l\'admin, dépôt de fonds, commission reçue…'}</div>
    <label class="fl">Montant (F CFA)</label>
    <input type="text" inputmode="numeric" class="money" id="mv-montant" placeholder="0" oninput="fmtIn(this)">
    <label class="fl">Motif</label>
    <input type="text" id="mv-motif" placeholder="${mvType==='sortie'?'ex : versement admin, transport, eau…':'ex : appro UV Orange, dépôt patron…'}">

  </div>`;

  h += `<div class="card"><h2><span class="hic">📤</span>Sorties du jour <span class="tag">−${fmt(sumMv(day,'sorties'))}</span></h2>`+
    (day.sorties.length ? day.sorties.map((m,i)=>mvRow(m,i,'sorties')).join('') : `<div class="empty"><span class="ei">📤</span>Aucune sortie aujourd'hui</div>`) + `</div>`;
  h += `<div class="card"><h2><span class="hic">📥</span>Entrées du jour <span class="tag">+${fmt(sumMv(day,'entrees'))}</span></h2>`+
    (day.entrees.length ? day.entrees.map((m,i)=>mvRow(m,i,'entrees')).join('') : `<div class="empty"><span class="ei">📥</span>Aucune entrée aujourd'hui</div>`) + `</div>`;
  return h;
}

function mvRow(m,i,type){
  const neg = type==='sorties';
  return `<div class="mv">
    <div class="ic">${neg?'📤':'📥'}</div>
    <div><div class="tt">${esc(m.motif)||'—'}</div><div class="ts">${m.time}</div></div>
    <div class="amt ${neg?'neg':'pos'}">${neg?'−':'+'}${fmt(m.montant)}</div>
    <button class="del" onclick="delMv('${type}',${i})">🗑</button>
  </div>`;
}

function addMv(){
  const day = getDay(); if(!day) return;
  const montant = num($('mv-montant').value);
  const motif = $('mv-motif').value.trim();
  if(montant<=0){ toast('⚠️ Saisis un montant'); return; }
  if(!motif){ toast('⚠️ Indique le motif — c\'est ça qui structure !'); return; }
  const list = mvType==='sortie' ? day.sorties : day.entrees;
  list.push({time: nowHM(), montant, motif});
  save(); syncDay(); vibrate(35); toast('✅ Enregistré'); render();
}

async function delMv(type,i){
  const day = getDay(); if(!day) return;
  const m = day[type][i]; if(!m) return;
  const lbl = (type==='sorties'?'la sortie':'l\'entrée')+' « '+m.motif+' » ('+fmt(m.montant)+')';
  if(!await pinOk('supprimer '+lbl)) return;
  if(!await askConfirm('Supprimer ce mouvement ?', esc(lbl)+'<br>L\'admin sera notifié de la suppression.',{icon:'🗑',danger:true,ok:'Supprimer'})) return;
  audit('🗑 Suppression : '+lbl);
  alertTg('🗑 <b>Mouvement supprimé</b> : '+esc(lbl)+' (saisi à '+m.time+')'+(S.config.agent?'\n👤 '+esc(S.config.agent):''));
  day[type].splice(i,1); save(); syncDay(); render();
}

/* ══════════ VUE : HISTORIQUE ══════════ */
function vHistorique(){
  let h = header();
  const keys = Object.keys(S.days).sort().reverse();
  if(!keys.length){
    return h + `<div class="card"><h2><span class="hic">📅</span>Historique</h2><div class="empty"><span class="ei">📅</span>Aucune journée enregistrée pour l'instant</div></div>`;
  }

  /* stats 7 derniers jours */
  const last7 = keys.slice(0,7).map(k=>({k, d:S.days[k]})).filter(x=>lastCp(x.d));
  if(last7.length){
    const manq7 = last7.reduce((a,x)=>{ const cp=lastCp(x.d); return a + Math.max(0, cp.theorique-cp.reelTotal); },0);
    const sort7 = last7.reduce((a,x)=> a + sumMv(x.d,'sorties'), 0);
    const okDays = last7.filter(x=>{ const cp=lastCp(x.d); return cp.theorique-cp.reelTotal <= 0; }).length;
    h += `<div class="kpis">
      <div class="kpi"><div class="kl">Manquant creusé · 7j</div><div class="kv ${manq7>0?'neg':'pos'}">${fmt(manq7)}</div><div class="ks">${last7.length} jour${last7.length>1?'s':''} pointé${last7.length>1?'s':''}</div></div>
      <div class="kpi"><div class="kl">Sorties · 7j</div><div class="kv">${fmt(sort7)}</div><div class="ks">total des dépenses</div></div>
      <div class="kpi" style="grid-column:1/-1"><div class="kl">Jours sans manquant</div><div class="kv ${okDays===last7.length?'pos':''}">${okDays} / ${last7.length}</div><div class="ks">${okDays===last7.length?'parfait, continue comme ça 💪':'objectif : tous les jours à 0'}</div></div>
    </div>`;
  }

  const evo = chartManquant();
  if(evo) h += `<div class="card"><h2><span class="hic">📈</span>Évolution du manquant</h2>${evo}</div>`;

  keys.forEach(k=>{
    const d = S.days[k];
    const cp = lastCp(d);
    const manqJour = cp ? cp.theorique - cp.reelTotal : 0;
    const manqTotal = manqJour + (+d.ouverture.manquantInitial||0);
    const open = hOpen === k;
    const [yy,mm,dd] = k.split('-');
    h += `<div class="hday ${open?'open':''}">
      <div class="hday-head" onclick="hOpen=hOpen==='${k}'?null:'${k}';render()">
        <div class="hcal"><div class="hd1">${+dd}</div><div class="hd2">${new Date(+yy,mm-1,+dd).toLocaleDateString('fr-FR',{month:'short'}).replace('.','')}</div></div>
        <div><div class="d">${new Date(+yy,mm-1,+dd).toLocaleDateString('fr-FR',{weekday:'long'})}</div><div class="s">${d.cloture?'🔒 clôturée':'ouverte'} · ${(d.checkpoints||[]).filter(c=>c).length}/${S.config.checkpoints.length} pointages</div></div>
        <div class="m ${manqTotal>0?'neg':'pos'}">${manqTotal>0?'−':''}${fmt(Math.abs(manqTotal))}</div>
        <span class="chev">▶</span>
      </div>
      ${open ? `<div class="hday-body">
        <div class="calc">
          <div class="cr"><span class="mut">Ouverture (${d.ouverture.time})</span><b>${fmt(totalOf(d.ouverture.soldes))}</b></div>
          ${(d.checkpoints||[]).filter(c=>c).map(c=>{
            const mj = c.theorique - c.reelTotal;
            return `<div class="cr"><span class="mut">${esc(c.label)} (${c.time})${c.corrections?' ✏️':''}</span><b class="${mj>0?'neg':'pos'}">réel ${fmt(c.reelTotal)} · ${mj>0?'−':'+'}${fmt(Math.abs(mj))}</b></div>`;
          }).join('')}
          <div class="cr"><span class="mut">Sorties</span><b class="neg">−${fmt(sumMv(d,'sorties'))}</b></div>
          <div class="cr"><span class="mut">Entrées</span><b class="pos">+${fmt(sumMv(d,'entrees'))}</b></div>
          <div class="cr total"><span>Manquant total</span><b class="${manqTotal>0?'neg':'pos'}">${fmt(Math.abs(manqTotal))}${manqTotal<0?' (surplus)':''}</b></div>
        </div>
        ${(d.sorties||[]).length? `<h3 class="sec">Sorties</h3>`+d.sorties.map(m=>`<div class="mv"><div class="ic">📤</div><div><div class="tt">${esc(m.motif)}</div><div class="ts">${m.time}</div></div><div class="amt neg">−${fmt(m.montant)}</div></div>`).join(''):''}
      </div>`:''}
    </div>`;
  });
  return h;
}

async function saveCfg(showToast){
  const c = S.config;
  if(c.adminPin && !await pinOk('modifier les réglages')){ render(); return false; }
  const newPin = $('cfg-pin').value.trim();
  if(newPin && !/^\d{4,6}$/.test(newPin)){ toast('⚠️ Le code doit faire 4 à 6 chiffres'); return false; }
  if(newPin !== c.adminPin){
    audit(newPin ? '🔐 Code admin '+(c.adminPin?'modifié':'activé') : '🔓 Code admin désactivé');
    if(c.tgToken && c.tgChat) alertTg(newPin ? '🔐 Le code admin a été '+(c.adminPin?'<b>modifié</b>':'<b>activé</b>')+'.' : '🔓 Le code admin a été <b>désactivé</b> !');
    c.adminPin = newPin;
  }
  c.autoSend = $('cfg-autosend').checked;
  c.lateAlert = $('cfg-latealert').checked;
  c.dimancheOff = $('cfg-dimanche').checked;
  c.agence = $('cfg-agence').value.trim() || 'Mon Agence';
  c.agent = $('cfg-agent').value.trim();
  c.tgToken = $('cfg-tgtoken').value.trim();
  c.tgChat = $('cfg-tgchat').value.trim();
  c.syncUrl = $('cfg-syncurl').value.trim();
  c.syncSecret = $('cfg-syncsecret').value.trim();
  c.notif = $('cfg-notif').checked;
  c.checkpoints.forEach((cp,i)=>{ cp.t = $('cfg-cp-'+i).value || cp.t; });
  relabelCps();
  save();
  if(c.notif && 'Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
  if(showToast===true) toast('✅ Réglages enregistrés');
  return true;
}

async function wipeAll(){
  if(!await pinOk('EFFACER TOUTES les données de l\'app')) return;
  if(!await askConfirm('Tout effacer ?','Historique, réglages et journal seront <b>définitivement perdus</b>. Fais une sauvegarde avant !',{icon:'🗑',danger:true,ok:'Tout effacer'})) return;
  alertTg('🗑 <b>TOUTES les données de l\'app ont été effacées</b> (historique + réglages).');
  localStorage.removeItem(KEY); S = load(); migrate(); wizStep = 0; go('jour');
}

/* recharge la dernière version de l'app (les données localStorage sont conservées) */
async function forceUpdate(){
  toast('🔄 Mise à jour en cours…');
  try{
    if(navigator.serviceWorker){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const r of regs) await r.unregister();
    }
  }catch(e){}
  try{
    const keys = await caches.keys();
    for(const k of keys) await caches.delete(k);
  }catch(e){}
  setTimeout(()=> location.reload(), 400);
}

/* ══════════ SAUVEGARDE / EXPORT ══════════ */
function dl(filename, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function exportJSON(){
  dl('agence-pro-sauvegarde-'+todayKey()+'.json', JSON.stringify(S, null, 1), 'application/json');
  audit('⬇️ Sauvegarde exportée');
  toast('⬇️ Sauvegarde téléchargée');
}
async function importJSON(input){
  const f = input.files && input.files[0];
  input.value = '';
  if(!f) return;
  if(!await pinOk('restaurer une sauvegarde')) return;
  try{
    const txt = await f.text();
    const data = JSON.parse(txt);
    if(!data.config || !data.days) throw new Error('format invalide');
    if(!await askConfirm('Restaurer cette sauvegarde ?', Object.keys(data.days).length+' journée(s) · agence « '+esc(data.config.agence||'?')+' »<br>Les données actuelles seront remplacées.',{icon:'⬆️',ok:'Restaurer'})) return;
    S = data; migrate();
    S.config.setupDone = true;
    audit('⬆️ Sauvegarde restaurée ('+f.name+')');
    save(); toast('✅ Sauvegarde restaurée'); go('jour');
  }catch(e){
    toast('❌ Fichier invalide : '+e.message);
  }
}
function exportCSV(){
  const rows = [['date','ouverture','entrees','sorties','theorique','reel','manquant_jour','ancien_manquant','manquant_total','pointages','cloturee']];
  Object.keys(S.days).sort().forEach(k=>{
    const d = S.days[k];
    const cp = lastCp(d);
    const mj = cp ? cp.theorique - cp.reelTotal : '';
    rows.push([
      k, totalOf(d.ouverture.soldes), sumMv(d,'entrees'), sumMv(d,'sorties'),
      cp?cp.theorique:'', cp?cp.reelTotal:'', mj,
      +d.ouverture.manquantInitial||0,
      cp? mj + (+d.ouverture.manquantInitial||0) : '',
      (d.checkpoints||[]).filter(c=>c).length,
      d.cloture?'oui':'non'
    ]);
  });
  dl('agence-pro-historique-'+todayKey()+'.csv', '﻿'+rows.map(r=>r.join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  toast('📊 Historique CSV téléchargé');
}

/* ══════════ TELEGRAM ══════════ */
async function tgSend(text, silent){
  const c = S.config;
  if(!c.tgToken || !c.tgChat){
    if(!silent){ toast('⚠️ Configure d\'abord Telegram dans ⚙️ Réglages'); go('reglages'); }
    return false;
  }
  try{
    const r = await fetch('https://api.telegram.org/bot'+c.tgToken+'/sendMessage',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: c.tgChat, text, parse_mode:'HTML'})
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.description||'Erreur Telegram');
    return true;
  }catch(e){
    if(!silent) toast('❌ Échec envoi : '+e.message);
    return false;
  }
}

}

function reportCp(day, cp){
  const c = S.config;
  const manqJour = cp.theorique - cp.reelTotal;
  const manqTotal = manqJour + (+day.ouverture.manquantInitial||0);
  const delta = manqJour - prevManquant(day, cp.idx);
  let t = '🏪 <b>'+esc(c.agence).toUpperCase()+'</b> — POINTAGE '+esc(cp.label).toUpperCase()+'\n';
  t += '📅 '+frDate(todayKey())+' à '+cp.time + (c.agent? '\n👤 '+esc(c.agent) : '') + '\n';
  if(cp.corrections) t += '✏️ <b>Pointage corrigé '+cp.corrections+' fois</b>\n';
  t += '\n';
  t += '━━ SOLDES RÉELS ━━\n';
  SERVICES.forEach(s=>{ t += s.e+' '+s.n+' : <b>'+fmt(+cp.soldes[s.k]||0)+'</b>\n'; });
  t += 'Σ Total réel : <b>'+fmt(cp.reelTotal)+'</b>\n\n';
  t += '━━ CALCUL ━━\n';
  t += 'Ouverture : '+fmt(totalOf(day.ouverture.soldes))+'\n';
  t += '+ Entrées : '+fmt(sumMv(day,'entrees'))+'\n';
  t += '− Sorties : '+fmt(sumMv(day,'sorties'))+'\n';
  t += '= Théorique : <b>'+fmt(cp.theorique)+'</b>\n\n';
  if(manqJour>0){
    t += '⚠️ <b>MANQUANT DU JOUR : '+fmt(manqJour)+'</b>\n';
    t += '(depuis pointage précédent : '+(delta>0?'+':'')+fmt(delta)+')\n';
  }else{
    t += '✅ Aucun manquant sur la journée'+(manqJour<0? ' (surplus '+fmt(-manqJour)+')':'')+'\n';
  }
  t += '📉 Ancien manquant : '+fmt(+day.ouverture.manquantInitial||0)+'\n';
  t += (manqTotal>0? '🔴' : '🟢')+' <b>MANQUANT TOTAL : '+fmt(Math.abs(manqTotal))+(manqTotal<0?' (surplus)':'')+'</b>\n';
  const sorties = day.sorties||[];
  if(sorties.length){
    t += '\n━━ SORTIES ━━\n';
    sorties.forEach(m=>{ t += '• '+m.time+' — '+esc(m.motif)+' : '+fmt(m.montant)+'\n'; });
  }
  const entrees = day.entrees||[];
  if(entrees.length){
    t += '\n━━ ENTRÉES ━━\n';
    entrees.forEach(m=>{ t += '• '+m.time+' — '+esc(m.motif)+' : '+fmt(m.montant)+'\n'; });
  }
  return t;
}

async function sendCp(idx, auto){
  const day = getDay(); if(!day) return;
  const cp = day.checkpoints && day.checkpoints[idx];
  if(!cp){ toast('⚠️ Fais d\'abord le pointage'); return; }
  if(!auto) toast('⏳ Envoi en cours…');
  if(await tgSend(reportCp(day, cp), !!auto)){
    cp.sent = nowHM(); save();
    toast(auto ? '📨 Rapport envoyé automatiquement à l\'admin' : '✅ Rapport envoyé à l\'admin !');
    render();
  }
}

async function cloturer(){
  const day = getDay(); if(!day) return;
  if(!await askConfirm('Clôturer la journée ?','Le rapport final sera envoyé à l\'admin. Demain, l\'ouverture sera pré-remplie avec tes soldes de fermeture.',{icon:'🔒',ok:'Clôturer'})) return;
  const cp = lastCp(day);
  day.cloture = true;
  audit('🔒 Journée clôturée');
  save();
  syncDay();
  syncEvent('cloture', 'Journée clôturée — manquant total '+(cp? fmt((cp.theorique-cp.reelTotal)+(+day.ouverture.manquantInitial||0)) : '—'));
  if(cp){
    toast('⏳ Envoi du rapport de clôture…');
    let t = '🔒 <b>RAPPORT DE CLÔTURE</b>\n\n' + reportCp(day, cp);
    if(await tgSend(t, true)){ cp.sent = nowHM(); save(); toast('🔒 Journée clôturée + rapport envoyé !'); }
    else toast('🔒 Journée clôturée (rapport non envoyé — vérifie Telegram)');
  }
  render();
}

/* ══════════ RAPPELS ══════════ */
function checkReminders(){
  const day = getDay();
  const tk = todayKey();
  if(!S.notified[tk]) S.notified[tk] = {};
  Object.keys(S.notified).forEach(k=>{ if(k!==tk) delete S.notified[k]; });
  const now = nowHM();
  const toMin = h => { const p = h.split(':'); return (+p[0])*60 + (+p[1]); };
  const offToday = isOffDay() && !day;
  S.config.checkpoints.forEach((c,i)=>{
    if(offToday) return;
    const done = day && day.checkpoints && day.checkpoints[i];
    if(done) return;
    if(S.config.lateAlert && day && !S.notified[tk]['late'+i] && toMin(now) >= toMin(c.t)+30){
      S.notified[tk]['late'+i] = true; save();
      audit('⏰ Pointage '+c.t+' en retard (+30 min)');
      alertTg('⏰ Le pointage <b>'+esc(c.label)+'</b> n\'est <b>toujours pas fait</b> à '+now+' (plus de 30 min de retard).'+(S.config.agent?'\n👤 Agent en poste : '+esc(S.config.agent):''));
    }
    if(S.notified[tk][i]) return;
    if(now >= c.t){
      S.notified[tk][i] = true; save();
      const msg = '⏰ Pointage « '+c.label+' » — compte tes caisses et saisis les soldes réels !';
      if(S.config.notif && 'Notification' in window && Notification.permission === 'granted'){
        try{
          new Notification('Agence Pro', {body: msg, icon:'icon-192.png', tag:'cp-'+i});
        }catch(e){
          if(navigator.serviceWorker && navigator.serviceWorker.ready){
            navigator.serviceWorker.ready.then(reg=> reg.showNotification('Agence Pro',{body:msg, icon:'icon-192.png', tag:'cp-'+i}));
          }
        }
      }
      toast(msg);
      if(tab==='jour') render();
    }
  });
  const clock = $('clock');
  if(clock) clock.textContent = nowHM();
  flushSync();
}
setInterval(checkReminders, 30000);

/* ══════════ INIT ══════════ */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
render();
checkReminders();
</script>
